<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio RAG – Query</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-box {
            background: #ffffff;
            padding: 20px;
            width: 420px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        h3 {
            text-align: center;
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #1e40af;
        }

        #response {
            margin-top: 15px;
            font-size: 14px;
            color: #111827;
        }

        small {
            color: #6b7280;
        }

        .spinner {
    margin: 10px auto;
    width: 30px;
    height: 30px;
    border: 4px solid #e5e7eb;
    border-top: 4px solid #2563eb;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

    </style>
</head>
<body>

<div class="chat-box">
    <h3>Ask from Audio</h3>

    <input
        type="text"
        id="query"
        placeholder="Type your question here..."
    />

    <button id="askBtn" onclick="askQuestion()">Ask</button>


    <div id="response"></div>
</div>

<div id="loading" style="display:none; text-align:center; margin-top:15px;">
    <div class="spinner"></div>
    <p>AI is generating the answer…</p>
</div>


<script>
async function askQuestion() {
    const queryInput = document.getElementById("query");
    const query = queryInput.value;
    const responseDiv = document.getElementById("response");
    const loadingDiv = document.getElementById("loading");
    const button = document.getElementById("askBtn");

    if (!query.trim()) {
        alert("Please enter a question");
        return;
    }

    // SHOW loading
    loadingDiv.style.display = "block";
    responseDiv.innerHTML = "";
    button.disabled = true;

    try {
        const res = await fetch("/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ query })
        });

        const data = await res.json();

        let output = `<h4>Answer:</h4>
            <p>${data.answer}</p>
        `;

        if (data.references && data.references.length > 0) {
            output += "<small>Referenced from:</small><ul>";
            data.references.forEach(r => {
                output += `
                    <li>
                        ${r.start_time.toFixed(2)}s – ${r.end_time.toFixed(2)}s
                    </li>
                `;
            });
            output += "</ul>";
        }

        responseDiv.innerHTML = output;

    } catch (error) {
        responseDiv.innerHTML = "❌ Error generating answer.";
    } finally {
        // HIDE loading
        loadingDiv.style.display = "none";
        button.disabled = false;
    }
}
</script>



</body>
</html>
